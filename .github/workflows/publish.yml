name: CI & Release (PyPI, Crates.io, npm & GitHub)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI, Crates.io, and npm'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  test-rust:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run Cargo Tests
        run: cargo test --release

  wasm:
    name: WebAssembly Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.127
      - name: Build WebAssembly Targets
        run: |
          chmod +x scripts/build_wasm.sh
          ./scripts/build_wasm.sh
      - name: Run Wasm Smoke Tests
        run: node tests/test_wasm_smoke.js
      - name: Pack npm package
        run: |
          mkdir -p dist
          cd wasm
          npm pack --pack-destination ../dist
      - name: Upload wasm package
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: dist/chunkr-wasm-*.tgz

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64, armv7, s390x, ppc64le]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release-pypi:
    name: Release to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: [test-rust, linux, windows, macos, sdist]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  release-cargo:
    name: Release to Crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: [test-rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to Crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-npm:
    name: Release to npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: [wasm]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: dist
      - name: Publish to npm
        run: |
          npm publish dist/chunkr-wasm-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

  release-github:
    name: Release to GitHub
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-rust, wasm, linux, windows, macos, sdist]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch git tags
        run: git fetch --tags --force
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: dist
      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_TYPE=$(git cat-file -t "${{ github.ref_name }}" 2>/dev/null || echo "")
          TAG_SUBJECT=$(git tag -l --format="%(contents:subject)" "${{ github.ref_name }}")
          TITLE="${TAG_SUBJECT:-${{ github.ref_name }}}"

          # Extract notes if annotated tag
          if [ "$TAG_TYPE" = "tag" ]; then
            git tag -l --format="%(contents:body)" "${{ github.ref_name }}" > /tmp/release_notes.md
          fi

          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists. Updating title, notes and assets..."
            if [ -s /tmp/release_notes.md ]; then
              gh release edit "${{ github.ref_name }}" --title "$TITLE" --notes-file /tmp/release_notes.md
            else
              gh release edit "${{ github.ref_name }}" --title "$TITLE"
            fi
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            if [ -s /tmp/release_notes.md ]; then
              echo "Creating release with annotated tag title and notes..."
              gh release create "${{ github.ref_name }}" dist/* \
                --title "$TITLE" \
                --notes-file /tmp/release_notes.md
            else
              echo "Creating release with tag title and auto-generated notes..."
              gh release create "${{ github.ref_name }}" dist/* \
                --title "$TITLE" \
                --generate-notes
            fi
          fi
