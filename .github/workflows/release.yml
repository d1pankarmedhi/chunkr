name: Release

# ──────────────────────────────────────────────────────────────────────────
# Single entry point for publishing. Triggered ONLY by:
#   1. Pushing an annotated tag  `vX.Y.Z`  (the normal path), or
#   2. Manual dispatch (dry-run / re-publish / hotfix).
# CI (fmt, clippy, tests) runs in ci.yml — this workflow assumes the tag
# commit is already green and focuses on: version gate → build → attest →
# publish to PyPI + crates.io + npm + GitHub Releases.
# ──────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # v1.3.0, v2.0.0-rc.1 excluded on purpose
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + validate only (skip all publishes)"
        required: false
        type: boolean
        default: true
      target:
        description: "Publish target (all | pypi | crates | npm | github)"
        required: false
        type: choice
        default: all
        options: [all, pypi, crates, npm, github]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-publish

permissions: {} # least privilege — each job declares its own

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG_NAME: ${{ github.ref_name }}

jobs:
  # ── 0. Gate: (tag) ↔ manifests ↔ changelog must agree ───────────────────
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_prerelease: ${{ steps.v.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # On a tag push github.ref_name IS the tag; on workflow_dispatch it is
      # the branch (e.g. main), so the annotated-tag rule must only apply to
      # tag-triggered runs. Manual dispatch validates manifests + changelog
      # against the manifest version instead.
      - name: Determine expected version + prerelease flag
        id: v
        run: |
          CARGO_V=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          PY_V=$(grep '^version' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          WASM_V=$(grep '"version"' wasm/package.json | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "cargo=$CARGO_V py=$PY_V wasm=$WASM_V"
          [ "$CARGO_V" = "$PY_V" ]   || { echo "::error::Manifest drift: Cargo.toml=$CARGO_V pyproject.toml=$PY_V"; exit 1; }
          [ "$CARGO_V" = "$WASM_V" ] || { echo "::error::Manifest drift: Cargo.toml=$CARGO_V wasm/package.json=$WASM_V"; exit 1; }
          echo "version=$CARGO_V" >> "$GITHUB_OUTPUT"
          case "$CARGO_V" in *-* ) echo "is_prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "is_prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - name: Tag must be annotated and match manifests (tag push only)
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TYPE=$(git cat-file -t "$TAG_NAME")
          if [ "$TYPE" != "tag" ]; then
            echo "::error::Tag $TAG_NAME is lightweight ($TYPE). Re-create it annotated: git tag -a $TAG_NAME -m \"...\""
            exit 1
          fi
          TAG_V="${TAG_NAME#v}"
          CARGO_V="${{ steps.v.outputs.version }}"
          [ "$TAG_V" = "$CARGO_V" ] || { echo "::error::Tag $TAG_V != manifests $CARGO_V"; exit 1; }
      - name: CHANGELOG must have an entry for this version
        run: |
          V="${{ steps.v.outputs.version }}"
          grep -qE "^## \[${V}\]|\[${V}\]" CHANGELOG.md || {
            echo "::error::No CHANGELOG.md entry for [$V]. Add one before tagging (Keep-a-Changelog).";
            exit 1;
          }

  # ── 1. Build wheels (curated arch matrix — see PUBLISHING.md § arch) ─────
  wheels-linux:
    name: Wheels (linux ${{ matrix.target }})
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64] # exotic arches (armv7/s390x/ppc64le) dropped: no test coverage, 10x CI cost
    runs-on: ${{ matrix.target == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  wheels-windows:
    name: Wheels (windows x64)
    needs: [validate]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64 # x86 (32-bit) dropped: abi3-py38 has no 32-bit test story
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --locked --out dist --find-interpreter
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist
          if-no-files-found: error

  wheels-macos:
    name: Wheels (macos ${{ matrix.target }})
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --find-interpreter
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  # ── 2. Wasm build + smoke + pack (npm publishes the tarball) ─────────────
  wasm:
    name: Wasm build & pack
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # wasm-bindgen-cli schema MUST exactly match the wasm-bindgen crate
      # in Cargo.lock. Derive it dynamically so `cargo update -p wasm-bindgen`
      # can never silently break this job again.
      - name: Resolve wasm-bindgen-cli version from Cargo.lock
        id: wbg
        run: |
          V=$(grep -A3 'name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen-cli version: $V"
      - name: Install wasm-bindgen-cli (cached)
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wbg.outputs.version }}
      - name: Build Wasm targets
        run: |
          chmod +x scripts/build_wasm.sh
          ./scripts/build_wasm.sh
      - name: Smoke test
        run: node tests/test_wasm_smoke.js
      - name: Pack npm tarball
        run: |
          mkdir -p dist
          cd wasm
          npm pack --pack-destination ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: dist/chunkr-wasm-*.tgz
          if-no-files-found: error

  # ── 3. Smoke-test the built wheels (catches broken abi3/manylinux) ───────
  smoke-wheels:
    name: Install wheel + import test
    needs: [wheels-linux, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local wheel and run test suite
        run: |
          # maturin manylinux wheels are named e.g.
          # chunkr_rs-1.4.0-...-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          # — there is no literal `linux_x86_64` segment, so match on the arch.
          WHEEL=$(ls dist/*x86_64*.whl | head -1)
          if [ -z "$WHEEL" ]; then
            echo "::error::No linux x86_64 wheel found in dist/: $(ls dist || true)"
            exit 1
          fi
          echo "Testing $WHEEL"
          pip install "$WHEEL" pytest
          pytest tests/test_python_bindings.py -q

  # ── 4. GitHub Release (assets + checksums + attestation) ─────────────────
  github:
    name: GitHub Release
    needs: [validate, smoke-wheels, wheels-windows, wheels-macos, wasm]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.target == 'all' || inputs.target == 'github')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/edit releases
      id-token: write # artifact attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: dist
      - name: SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Extract notes from annotated tag
        run: git tag -l --format="%(contents:body)" "$TAG_NAME" > /tmp/release_notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release_notes.md
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          generate_release_notes: true # appended fallback if tag body is thin
          append_body: true
          files: |
            dist/*
          fail_on_unmatched_files: true

  # ── 5a. PyPI via API token ──────────────────────────────────────────────
  # Token: PyPI → Account settings → API tokens (scope: chunkr-rs project).
  # Stored as repo/environment secret PYPI_API_TOKEN. See PUBLISHING.md §1.
  # TODO: migrate to Trusted Publishing (OIDC) — no long-lived secret.
  pypi:
    name: Publish to PyPI
    needs: [validate, smoke-wheels, wheels-windows, wheels-macos, github]
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.dry_run == false &&
      (inputs.target == 'all' || inputs.target == 'pypi')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: pypi # gate + secret scope (see PUBLISHING.md)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ── 5b. crates.io via API token ─────────────────────────────────────────
  # Token: crates.io → Account Settings → API Tokens (scope: publish chunkr).
  # Stored as repo/environment secret CARGO_REGISTRY_TOKEN. See PUBLISHING.md §1.
  # TODO: migrate to crates.io Trusted Publishing (OIDC) — no long-lived secret.
  crates:
    name: Publish to crates.io
    needs: [validate, github]
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.dry_run == false &&
      (inputs.target == 'all' || inputs.target == 'crates')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: cargo publish (dry-run gate first)
        run: cargo publish --locked --dry-run
      - name: cargo publish
        run: cargo publish --locked --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  # ── 5c. npm via automation token ────────────────────────────────────────
  # Token: npmjs.com → Access Tokens → Generate New Token → Automation
  # (Automation bypasses 2FA by design; keep it secret). Stored as
  # repo/environment secret NPM_TOKEN. See PUBLISHING.md §1.
  # TODO: migrate to npm provenance (OIDC) for Sigstore-signed publishes.
  npm:
    name: Publish to npm
    needs: [validate, wasm, github]
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.dry_run == false &&
      (inputs.target == 'all' || inputs.target == 'npm')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: npm
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: dist
      - name: Publish to npm
        # Never `continue-on-error` — a failed publish must fail the
        # workflow loudly so the release isn't half-green.
        run: npm publish dist/chunkr-wasm-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
