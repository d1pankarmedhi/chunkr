[package]
authors = ["Dipankar dipankarmedhi11@gmail.com"]
edition = "2021"
license = "MIT"
name = "chunkr"
version = "1.1.0"
description = "Blazingly fast document and text chunking library for LLMs and RAG in Rust and Python"
repository = "https://github.com/d1pankarmedhi/chunkr"
readme = "README.md"
keywords = ["chunking", "rag", "llm", "nlp", "text-splitter"]
categories = ["text-processing", "science"]

[lib]
name = "chunkr"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
lopdf = { version = "0.32.0", features = ["pom", "pom_parser"] }
serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1.0.117"
tiktoken-rs = "0.6"
regex = "1.10"
memchr = "2.7"
rayon = "1.10"
thiserror = "1.0"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
pyo3 = { version = "0.22", features = ["abi3-py38"], optional = true }
