[package]
authors = ["Dipankar dipankarmedhi11@gmail.com"]
edition = "2021"
license = "MIT"
name = "chunkr"
version = "1.3.0"
description = "Blazingly fast document and text chunking library for LLMs, RAG, and AI agents in Rust and Python"
repository = "https://github.com/d1pankarmedhi/chunkr"
homepage = "https://github.com/d1pankarmedhi/chunkr"
documentation = "https://docs.rs/chunkr"
readme = "README.md"
keywords = ["chunking", "rag", "llm", "text-splitter", "nlp"]
categories = ["text-processing", "science", "development-tools"]

[lib]
name = "chunkr"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "chunkr"
path = "src/bin/cli.rs"
required-features = ["cli"]

[features]
default = ["cli"]
python = ["dep:pyo3", "pyo3/extension-module"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]
cli = ["dep:clap"]

[dependencies]
lopdf = { version = "0.34.0", features = ["pom", "pom_parser"] }
serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1.0.117"
tiktoken-rs = "0.12"
regex = "1.10"
memchr = "2.7"
rayon = "1.10"
thiserror = "2.0"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
sha2 = "0.11"
clap = { version = "4.5", features = ["derive"], optional = true }
pyo3 = { version = "0.25", features = ["abi3-py38"], optional = true }
wasm-bindgen = { version = "0.2.92", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3.69", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tree-sitter = "0.27"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# PINNED to 0.3.x on purpose — do NOT bump to 0.4+ via Dependabot.
# chunkr never calls getrandom directly; this dep exists solely to switch
# the wasm_js backend ON for the whole wasm32 resolve via feature
# unification: tokenizers pulls getrandom 0.3 transitively (ahash/rand),
# and the global `--cfg getrandom_backend="wasm_js"` in .cargo/config.toml
# applies to EVERY getrandom copy. A 0.4 direct dep leaves the transitive
# 0.3 copy featureless, tripping its compile_error! guard (0.3.4+).
# Revisit only when ahash/rand move off getrandom 0.3.
getrandom = { version = "0.3", features = ["wasm_js"] }

