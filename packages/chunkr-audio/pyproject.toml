[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chunkr-audio"
version = "0.1.1"
description = "Speech-to-text for chunkr: Whisper transcripts with timestamps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Dipankar", email = "dipankarmedhi11@gmail.com" }]
keywords = ["chunkr", "audio", "whisper", "transcription", "asr", "rag", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["chunkr-rs[audio]>=1.7", "faster-whisper>=1.0"]

[project.urls]
Homepage = "https://github.com/d1pankarmedhi/chunkr"
Repository = "https://github.com/d1pankarmedhi/chunkr.git"
Documentation = "https://github.com/d1pankarmedhi/chunkr#audio-chunkr-rs-extra"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# Discovered by `import chunkr`; makes load_documents("*.mp3") work once the
# package is installed. Registration stays lazy: faster-whisper is imported on
# first transcription, so importing chunkr never pays for it.
[project.entry-points."chunkr.transcribers"]
whisper = "chunkr_audio:register"

[tool.hatch.build.targets.wheel]
packages = ["chunkr_audio"]
