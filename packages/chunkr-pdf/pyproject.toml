[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chunkr-pdf"
version = "0.1.1"
description = "High-fidelity PDF parsing for chunkr: layout, headings, tables, page labels and OCR via liteparse"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dipankar", email = "dipankarmedhi11@gmail.com" }]
keywords = ["chunkr", "pdf", "parser", "rag", "llm", "liteparse", "ocr", "tables"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["chunkr-rs>=1.6", "liteparse>=2.15,<3"]

[project.urls]
Homepage = "https://github.com/d1pankarmedhi/chunkr"
Repository = "https://github.com/d1pankarmedhi/chunkr.git"
Documentation = "https://github.com/d1pankarmedhi/chunkr#pdf-parsing-chunkr-rs-extra"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# OCR engines. Install one to use it as `ocr.backend`:
#   pip install "chunkr-pdf[ocr-rapid]"  -> PDFParser(ocr={"backend": "rapidocr"})
ocr-rapid = ["rapidocr>=3.0", "onnxruntime>=1.17"]
ocr-paddle = ["paddleocr>=3.0", "paddlepaddle>=3.0", "numpy>=1.24", "pillow>=10.0"]
ocr-easyocr = ["easyocr>=1.7", "numpy>=1.24", "pillow>=10.0"]
ocr-surya = ["surya-ocr>=0.6", "numpy>=1.24", "pillow>=10.0"]
ocr-all = [
    "rapidocr>=3.0",
    "onnxruntime>=1.17",
    "easyocr>=1.7",
    "numpy>=1.24",
    "pillow>=10.0",
]

# Discovered by `import chunkr`; makes PDFLoader(backend="auto") use this backend.
[project.entry-points."chunkr.pdf_backends"]
liteparse = "chunkr_pdf:register"

[tool.hatch.build.targets.wheel]
packages = ["chunkr_pdf"]
