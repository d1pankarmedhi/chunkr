[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chunkr-tabular"
version = "0.1.0"
description = "Parquet and Arrow IPC extraction for chunkr: columnar files chunked as tables"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Dipankar", email = "dipankarmedhi11@gmail.com" }]
keywords = ["chunkr", "parquet", "arrow", "tabular", "rag", "llm", "chunking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["chunkr-rs>=1.7", "pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/d1pankarmedhi/chunkr"
Repository = "https://github.com/d1pankarmedhi/chunkr.git"
Documentation = "https://github.com/d1pankarmedhi/chunkr#tabular-formats-chunkr-rs-extra"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# Discovered by `import chunkr`; makes load_documents("*.parquet") work.
[project.entry-points."chunkr.table_loaders"]
pyarrow = "chunkr_tabular:register"

[tool.hatch.build.targets.wheel]
packages = ["chunkr_tabular"]
